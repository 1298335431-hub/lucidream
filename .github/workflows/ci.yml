name: Core checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend-and-oauth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test:oauth

  backend:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: backend
      DREAMCARD_ENV: test
      DREAMCARD_MODEL_MODE: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pytest backend/tests -q --disable-warnings
